<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LockFlow Interlocks</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body><header><div class="brand"><span class="brand-mark">LF</span>LockFlow</div><nav><a href="/operations">Operations</a><a href="/chamber">Chamber</a><a aria-current="page" href="/interlocks">Interlocks</a><a href="/incidents">Incidents</a></nav></header>
<main><div class="page-title"><div><h1>Interlock control</h1><div class="muted">Mutual exclusion and emergency equipment state</div></div></div><div class="grid" id="interlock-grid"></div><div class="message" id="message"></div></main>
<script src="/assets/app.js"></script><script>
const {api,setMessage,withBusy}=window.LockFlow; const host=document.querySelector('#interlock-grid'); const message=document.querySelector('#message');
async function stop(chamber,button){await withBusy(button,async()=>{try{await api(`/api/chambers/${chamber}/emergency`,{method:'POST',body:'{}'});await load();}catch(e){setMessage(message,e.message);}});}
async function load(){const data=await api('/api/interlocks');host.innerHTML=Object.entries(data).filter(([id])=>id.startsWith('chamber')).map(([id,item])=>{const lvl=item.level||{};const verdict=lvl.decision==='release'?'<span style="color:#88e0a0">release</span>':'<span style="color:#f3a4a1">hold</span>';return `<section class="panel"><h2>${id}</h2><table><tr><th>Emergency</th><td>${item.emergency.status}</td></tr><tr><th>Latest level</th><td>${lvl.latest_meters!==undefined?Number(lvl.latest_meters).toFixed(3)+' m ('+(lvl.latest_quality||'none')+')':'no reading'}</td></tr><tr><th>Stability</th><td>${verdict}${lvl.reason?' — '+lvl.reason:''}</td></tr><tr><th>Samples</th><td>${lvl.sample_count??0}/${lvl.config?.minimum_samples??'-'} · span ${lvl.span_ms??0}/${lvl.config?.minimum_span_ms??'-'} ms · swing ${(lvl.swing_m??0).toFixed(3)}/${lvl.config?.swing_tolerance_m??'-'} m</td></tr><tr><th>Pending commands</th><td>${item.pending_commands.length}</td></tr></table><button class="danger" data-stop="${id}">Emergency stop</button></section>`;}).join('');host.querySelectorAll('[data-stop]').forEach((button)=>button.addEventListener('click',()=>stop(button.dataset.stop,button)));}
load().catch((e)=>setMessage(message,e.message));
</script></body></html>
